<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anchor — offline</title>
<style>
  :root { color-scheme: light; }
  body {
    margin: 0; min-height: 100dvh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
    background: #eceee4; color: #16180f;
    font-family: -apple-system, "SF Pro Text", system-ui, sans-serif;
    padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
    text-align: center;
  }
  .mark { display: flex; gap: 4px; margin-bottom: 8px; }
  .mark i { width: 18px; height: 18px; background: #16180f; border-radius: 2px; }
  .mark i.red { background: #d3305d; }
  h1 { font-size: 28px; margin: 0; letter-spacing: -0.02em; }
  p { margin: 0; color: #5a5f4e; font-size: 15px; max-width: 300px; line-height: 1.5; }
  button {
    margin-top: 16px; min-height: 48px; padding: 0 28px; border: 0;
    border-radius: 999px; background: #16180f; color: #eceee4;
    font-size: 16px; font-weight: 600; cursor: pointer;
  }
</style>
</head>
<body>
  <div class="mark" aria-hidden="true"><i></i><i class="red"></i><i></i></div>
  <h1>You're offline.</h1>
  <p>Anchor needs the internet for puzzles, marking and your progress. Reconnect, then try again.</p>
  <button onclick="location.replace('https://anchor-one-zeta.vercel.app/today')">Try again</button>
</body>
</html>
